name: Validate catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-catalog.cjs
      - run: node tests/catalog-feeds.cjs
      - run: node scripts/validate-specialist-catalog.cjs
      - run: node tests/specialist-catalog.cjs

      - run: node scripts/validate-github-hot.cjs
      - run: node tests/github-hot-feed.cjs

      - run: node tests/github-hot-admission-core.cjs
