# Install in the public feed repository, not the desktop source repository.
name: GitHub hot daily snapshots and weekly ranking
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      retry_guides:
        description: Manually retry pending guides after enabling a new provider
        type: boolean
        default: false
      publish:
        description: Publish a new edition today (never rewrite an existing edition)
        type: boolean
        default: false
      collect_only:
        description: Publish official source data without calling models this run
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: github-hot-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect official GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUBLISH: ${{ inputs.publish }}
          RETRY_GUIDES: ${{ inputs.retry_guides }}
          COLLECT_ONLY: ${{ inputs.collect_only }}
          COCKPIT_GEMINI_API_KEY: ${{ secrets.COCKPIT_GEMINI_API_KEY }}
          COCKPIT_HOT_GUIDE_KEYS: ${{ secrets.COCKPIT_HOT_GUIDE_KEYS }}
        run: |
          args=()
          if [ "$FORCE_PUBLISH" = "true" ]; then args+=(--publish); fi
          if [ "$RETRY_GUIDES" = "true" ]; then args+=(--retry-guides); fi
          if [ "$COLLECT_ONLY" = "true" ]; then args+=(--collect-only); fi
          node scripts/github-hot-collect.cjs --directory catalog --editorial catalog/github-hot-editorial.json "${args[@]}"
      - name: Validate published feed
        run: node scripts/validate-github-hot.cjs
      - name: Verify Chinese publication gate
        run: |
          node tests/github-hot-admission-core.cjs
          node tests/github-hot-ai-evidence.cjs
      - name: Save public snapshots and editions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/github-hot.json catalog/github-hot-state.json catalog/github-hot-guide-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update GitHub snapshots, Chinese guide queue and weekly edition'
          git push origin HEAD:main
