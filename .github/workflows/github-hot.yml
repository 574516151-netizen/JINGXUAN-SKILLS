# Install in the public feed repository, not the desktop source repository.
name: GitHub hot daily snapshots and weekly ranking
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new edition today (never rewrite an existing edition)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: github-hot-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect official GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$FORCE_PUBLISH" = "true" ]; then args+=(--publish); fi
          node scripts/github-hot-collect.cjs --directory catalog --editorial catalog/github-hot-editorial.json "${args[@]}"
      - name: Validate published feed
        run: node scripts/validate-github-hot.cjs
      - name: Save public snapshots and editions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/github-hot.json catalog/github-hot-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update GitHub hot snapshots and weekly edition'
          git push origin HEAD:main
